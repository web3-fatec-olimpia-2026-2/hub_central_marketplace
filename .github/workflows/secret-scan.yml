# =====================================================================
# SCAN DE SEGREDOS (BACKUP DO GITHUB SECRET SCANNING)
# =====================================================================
# Web III - FATEC Olímpia - 2026/2
#
# O GitHub já tem Secret Scanning nativo para repositórios públicos,
# mas essa camada extra usa a ferramenta Gitleaks para pegar padrões
# que o scanner nativo pode não detectar.
#
# Roda em TODO push. Se detectar chave secreta commitada, falha o CI
# e abre alerta no repositório.
#
# Documentação: https://github.com/gitleaks/gitleaks-action
# =====================================================================

name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Detectar segredos vazados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo (necessário para varrer histórico)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar e Executar Gitleaks (Open Source)
        run: |
          GITLEAKS_VERSION="8.24.2"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          chmod +x gitleaks
          ./gitleaks detect --source="." --config=".gitleaks.toml" --verbose --redact

